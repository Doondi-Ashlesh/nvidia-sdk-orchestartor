# config.yaml — NeMo Agent Toolkit workflow for the SDK Orchestrator.
#
# Run:  nat run --config_file config.yaml --input "<use case>"
#
# PHASE 1 — function-as-workflow.
# The workflow IS the select_blueprint function. It does its own NIM embedding
# (nim.py) and retrieval (store.py, numpy backend), so NO NAT llms / embedders /
# retrievers blocks are needed yet. `select_blueprint` is a registered workflow
# type (see register.py + the nat.components entry point in pyproject.toml).
#
# PHASE 2 will reintroduce, when there are multiple tools to orchestrate:
#   llms:        reasoner (nemotron-super) + classifier (nemotron-nano)
#   workflow:    react_agent  — REQUIRES: pip install "nvidia-nat[langchain]"
#                tool_names: [select_blueprint, write_notebook, run_on_gpu]
# The react_agent type ships in the langchain integration package, not core nat.

workflow:
  _type: select_blueprint
  top_k: 3
