# config.yaml — NeMo Agent Toolkit workflow for the SDK Orchestrator.
#
# Run:  nat run   --config_file config.yaml --input "<use case>"
#       nat serve --config_file config.yaml          # HTTP service for the UI
#
# Shape verified against nvidia-nat docs (functions / llms / embedders /
# retrievers / workflow top-level keys). The `functions` + `workflow` blocks
# are scaffolded for Increment 1B (the register_function glue), commented where
# they depend on imports that must be pinned against the installed package.

# ─── LLMs (role-specific per D5) ─────────────────────────────────
llms:
  reasoner:
    _type: nim
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 4096
    chat_template_kwargs:
      enable_thinking: true        # Nemotron reasoning mode

  classifier:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    temperature: 0.0
    max_tokens: 512

# ─── Embedder (grounding backbone, D8) ───────────────────────────
embedders:
  blueprint_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5

# ─── Retriever over the Milvus Lite blueprint collection ─────────
# Points at the ./milvus.db produced by `python -m sdk_orchestrator.ingest`.
retrievers:
  blueprint_kb:
    _type: milvus_retriever
    embedder: blueprint_embedder
    collection_name: blueprints
    uri: ${MILVUS_URI:-./milvus.db}
    top_k: 3

