# service/pyproject.toml
#
# The V2 orchestration service — Python, built on NeMo Agent Toolkit.
# Per decision D10, the orchestration brain lives here (Python/NAT);
# the Next.js app becomes UI/visualizer only and calls this service.
#
# Install:  cd service && pip install -e .
# Run:      nat run --config_file config.yaml --input "<goal>"
#           nat serve --config_file config.yaml    (HTTP service for the UI)

[project]
name = "sdk-orchestrator-service"
version = "0.1.0"
description = "NVIDIA SDK Orchestrator — NAT agent that tailors blueprints and verifies on GPU"
requires-python = ">=3.11,<3.14"   # nvidia-nat supports 3.11–3.13

dependencies = [
    "nvidia-nat",                  # NeMo Agent Toolkit (the harness — D1)
    "pymilvus>=2.4",               # Milvus Lite (embedded vector store — D8)
    "openai>=1.0",                 # OpenAI-compatible client for hosted NIM
    "pydantic>=2.0",               # manifest contract + tool schemas
    "nbformat>=5.10",              # reading blueprint .ipynb files
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

# Entry point so `nat` discovers our registered functions at runtime.
# (Increment 1B wires the actual functions here once imports are pinned
#  against the installed nvidia-nat version.)
[project.entry-points."nat.components"]
sdk_orchestrator = "sdk_orchestrator.register"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
